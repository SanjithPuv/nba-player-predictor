[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-next-game-predictor"
version = "0.1.0"
description = "Cutoff-aware NBA player points forecasts and evidence-grounded explanations"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pandas>=2.2", "pyarrow>=18", "duckdb>=2.0", "scikit-learn>=1.6", "scipy>=1.14", "joblib>=1.4", "requests>=2.32", "nba_api>=1.9", "streamlit>=1.42", "pydantic>=2.10", "matplotlib>=3.9", "pypdf>=5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "pip-tools>=7"]
llm = ["torch>=2.6", "transformers>=4.49,<5", "peft>=0.14", "accelerate>=1.3"]

[project.scripts]
nba-predictor = "nba_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
